<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(160deg, #ff9a3c 0%, #ff6b35 30%, #7a2c0d 65%, #000000 100%);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  video {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
    display: block;
  }

  #playBtn {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 60px;
    background: rgba(0,0,0,0.3);
    border: none;
    border-radius: 50%;
    width: 100px;
    height: 100px;
    color: white;
    cursor: pointer;
    z-index: 10;
  }

  #caption {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    -webkit-text-stroke: 1.5px #d94f00;
    font-family: 'Fredoka', cursive, sans-serif;
    font-size: 30px;
    font-weight: 700;
    text-align: center;
    text-shadow: 3px 3px 0px #d94f00, 0 4px 12px rgba(0,0,0,0.25);
    z-index: 10;
    width: 92%;
    line-height: 1.3;
    animation: pop 0.5s ease-out;
  }

  @keyframes pop {
    0% { transform: translateX(-50%) scale(0.7); opacity: 0; }
    100% { transform: translateX(-50%) scale(1); opacity: 1; }
  }
</style>
</head>
<body>

  <div id="caption">live love laugh white men 🤑<br>(my bebeh🥺❤)</div>

  <video id="vid" loop playsinline>
    <source src="lando-donut.mp4" type="video/mp4">
  </video>
  <button id="playBtn" onclick="document.getElementById('vid').play(); this.remove();">▶</button>

</body>
</html>
