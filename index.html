<!DOCTYPE html>
<html>
  <head> <link rel="stylesheet" href="style.css"> </head>
  <body>
  <style>
  body { margin: 0; background: black; }
  video { width: 100vw; height: 100vh; object-fit: contain; display: block; }
  #playBtn {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 60px; background: none; border: none; color: white;
    cursor: pointer; z-index: 10;
  }
</style>

<video id="vid" loop playsinline style="width:100vw; height:100vh; object-fit:contain;">
  <source src="lando-donuts.mp4" type="video/mp4">
</video>
<button id="playBtn" onclick="document.getElementById('vid').play(); this.remove();">▶</button>
  </body>
</html>
